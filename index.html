function showBT(n){[1,2].forEach(i=>{document.getElementById('bk'+i).style.display=i===n?'block':'none';document.getElementById('bt'+i).className='btab'+(i===n?' on':'');});}

function parseCSV(t){const ls=t.split(/\r?\n/).filter(l=>l.trim()),rs=[];for(const l of ls){const r=[];let f='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"')q=!q;else if((c===','||c===';'||c==='\t')&&!q){r.push(f.trim());f='';}else f+=c;}r.push(f.trim());rs.push(r);}return rs;}

function previewImport(input){if(!input.files[0])return;const file=input.files[0],reader=new FileReader();
if(file.name.match(/\.csv$|\.tsv$|\.txt$/i)){reader.onload=e=>processImport(parseCSV(e.target.result));reader.readAsText(file);}
else{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>{reader.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'binary'}),ws=wb.Sheets[wb.SheetNames[0]];processImport(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));}catch(err){toast('Error: '+err.message);}};reader.readAsBinaryString(file);};s.onerror=()=>toast('Error cargando lector');document.head.appendChild(s);}}

function processImport(rows){
if(rows.length<2)return toast('Archivo vacío');
const data=rows.slice(1).filter(r=>r[0]&&String(r[0]).trim());
const norm=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,' ');
const doPr=document.getElementById('bu-pr').checked,doSk=document.getElementById('bu-sk').checked,doNm=document.getElementById('bu-nm').checked,doIm=document.getElementById('bu-im').checked,doAdd=document.getElementById('bu-add').checked,doDel=document.getElementById('bu-del').checked;
let matched=0,added=0,deleted=0,updated=0;const results=[],matchedIds=new Set();

for(const row of data){const name=norm(row[0]),price=parseFloat(String(row[1]).replace(/[^0-9.,]/g,'').replace(',','.'))||0,code=String(row[2]||'').trim(),stock=parseInt(String(row[3]).replace(/[^0-9]/g,''))||0,imgUrl=(row[4]||'').trim();
let m=S.ps.find(p=>code&&String(p.id)===code);if(!m)m=S.ps.find(p=>norm(p.nm)===name);if(!m)m=S.ps.find(p=>norm(p.nm).includes(name)||name.includes(norm(p.nm)));
if(m){matched++;matchedIds.add(m.id);let ch=[];
if(doPr&&price>0&&price!==m.pr){ch.push(`$${m.pr}→$${price}`);m.pr=price;}
if(doSk&&stock!==m.sk){ch.push(`Stock:${m.sk}→${stock}`);m.sk=stock;}
if(doNm&&row[0]){const nn=String(row[0]).trim();if(nn!==m.nm){ch.push('Nombre');m.nm=nn;}}
if(catVal&&RAW.c.includes(catVal)&&catVal!==m.ct){ch.push("Cat:"+m.ct+"→"+catVal);m.ct=catVal;}if(catVal&&RAW.c.includes(catVal)&&catVal!==m.ct){ch.push('Cat→'+catVal);m.ct=catVal;}if(doIm&&imgUrl){m.im=imgUrl;ch.push('Imagen');}
if(code&&String(m.id)!==code){m.id=parseInt(code)||m.id;ch.push('Código');}
if(ch.length)updated++;
results.push({nm:m.nm,st:'✓',ch:ch.join(', ')||'Sin cambios'});
}else if(doAdd){const mx=Math.max(...S.ps.map(x=>x.id),2000)+1;const newId=code?parseInt(code)||mx:mx;S.ps.push({id:newId,nm:String(row[0]).trim(),pr:price,sk:stock,ct:(catVal&&RAW.c.includes(catVal))?catVal:'General',sl:false,sp:0,im:imgUrl||null,br:'',ms:'',cl:''});added++;results.push({nm:String(row[0]).trim(),st:'➕',ch:'Nuevo'});}
else{results.push({nm:String(row[0]).trim(),st:'⚠️',ch:'No encontrado'});}}

if(doDel){const before=S.ps.length;S.ps=S.ps.filter(p=>matchedIds.has(p.id));deleted=before-S.ps.length;}

let ph=`<div style="background:#fff;border:1px solid var(--brd);border-radius:12px;padding:14px;margin-top:12px"><div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><span class="chip g">✓ ${matched} encontrados</span><span class="chip b">📝 ${updated} actualizados</span>${added?`<span class="chip g">➕ ${added} nuevos</span>`:''}${deleted?`<span class="chip r">🗑 ${deleted} eliminados</span>`:''}</div>`;
ph+=`<div style="max-height:220px;overflow-y:auto;font-size:12px"><table style="width:100%;border-collapse:collapse"><tr style="background:#f5f5f7;position:sticky;top:0"><th style="padding:6px 8px;text-align:left">Est.</th><th style="padding:6px 8px;text-align:left">Producto</th><th style="padding:6px 8px;text-align:left">Cambios</th></tr>`;
results.slice(0,80).forEach(r=>{ph+=`<tr style="border-bottom:1px solid #f0f0f0"><td style="padding:4px 8px">${r.st}</td><td style="padding:4px 8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.nm}</td><td style="padding:4px 8px;color:var(--gray)">${r.ch}</td></tr>`;});
ph+=`</table></div><div class="br"><button class="bf2 bl" style="flex:1" onclick="saveM();closeModal();toast('✓ ${updated+added} productos actualizados${deleted?' · '+deleted+' eliminados':''}');render()">Confirmar</button><button class="bf2 gr" style="flex:1" onclick="closeModal()">Cancelar</button></div></div>`;
document.getElementById('bprev').innerHTML=ph;}

function exportCSV(){let c='Nombre,Precio,Codigo,Stock,Categoria,Marca,Medida,Color,EnOferta,PrecioOferta,ImagenURL\n';S.ps.forEach(p=>{const e=s=>'"'+String(s||'').replace(/"/g,'""')+'"';c+=`${e(p.nm)},${p.pr},${p.id},${p.sk},${e(p.ct)},${e(p.br)},${e(p.ms)},${e(p.cl)},${p.sl?'SI':'NO'},${p.sp||''},${e(p.im||'')}\n`;});const b=new Blob(['\ufeff'+c],{type:'text/csv;charset=utf-8;'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='aragua_color_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);toast('✓ CSV descargado');}

function calcCashea(){
const pid=document.getElementById('ca-prod').value,lvl=+(document.getElementById('ca-lvl').value);
if(!pid){document.getElementById('ca-result').innerHTML='';return;}
const p=findP(+pid);if(!p)return;
const total=p.pr*(1+IV);
const pcts={1:[60,40],2:[50,50],3:[40,60]};
const [iniPct,restPct]=pcts[lvl]||pcts[3];
const inicial=total*iniPct/100;
const cuota=(total*restPct/100)/3;
const today=new Date();
const dates=[new Date(today.getTime()+14*86400000),new Date(today.getTime()+28*86400000),new Date(today.getTime()+42*86400000)];
const fmtD=d=>d.toLocaleDateString('es-VE',{day:'2-digit',month:'short',year:'numeric'});

let r=`<div style="background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:14px;padding:18px;margin-top:12px">`;
r+=`<div style="text-align:center;margin-bottom:14px"><div style="font-size:13px;color:var(--gray)">Precio total (IVA incl.)</div><div style="font-size:28px;font-weight:800;color:#1d1d1f">${fmt(total)}</div></div>`;
r+=`<div style="background:#fff;border-radius:12px;padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:13px;font-weight:600">💰 Pago Inicial (${iniPct}%)</span><span style="font-size:18px;font-weight:800;color:var(--blue)">${fmt(inicial)}</span></div><div style="font-size:11px;color:var(--gray)">Al momento de la compra</div></div>`;
r+=`<div style="font-size:13px;font-weight:700;margin-bottom:8px">📅 3 Cuotas del ${restPct}% restante:</div>`;
dates.forEach((d,i)=>{r+=`<div style="background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center"><div><span style="font-weight:600;font-size:13px">Cuota ${i+1}</span><div style="font-size:11px;color:var(--gray)">${fmtD(d)}</div></div><span style="font-size:16px;font-weight:700">${fmt(cuota)}</span></div>`;});
r+=`<div style="text-align:center;margin-top:10px;font-size:11px;color:var(--gray)">Nivel ${lvl} · Cada 14 días · Total financiado: ${fmt(total)}</div></div>`;
document.getElementById('ca-result').innerHTML=r;
}

}

function showAdminLogin(){let h=`<div class="ov" onclick="closeModal()"><div class="md" style="max-width:320px;text-align:center" onclick="event.stopPropagation()"><div style="font-size:44px;margin-bottom:10px">🔐</div><h3 style="font-size:16px;font-weight:700;margin-bottom:14px">Administrador</h3><input class="fi" type="password" id="admin-pw" placeholder="Contraseña" style="text-align:center;margin-bottom:12px" onkeydown="if(event.key==='Enter')tryAdmin()"><button class="bf2 bl" onclick="tryAdmin()">Ingresar</button></div></div>`;document.getElementById('modals').innerHTML=h;setTimeout(()=>document.getElementById('admin-pw')?.focus(),100);}
function tryAdmin(){const pw=document.getElementById('admin-pw')?.value;if(pw===(S.sc.pw||'aragua2024')){S.ad=true;closeModal();toast('✓ Admin activado');render();}else toast('Contraseña incorrecta');}

// ===== SITE EDITOR =====
function showSiteEd(){
const c=S.sc,hi=getHI(),secs=getSecs();
let h=`<div class="ov" onclick="closeModal()"><div class="md" style="max-width:580px" onclick="event.stopPropagation()"><div class="md-h"><h3>📝 Editar Sitio</h3><button class="md-x" onclick="closeModal()">✕</button></div>`;
// PASSWORD
h+=`<div class="sec-ed"><label class="fl" style="color:var(--red)">🔑 CONTRASEÑA ADMIN</label><div class="fg"><input class="fi" id="sc-pw" type="password" value="${esc(c.pw||'aragua2024')}" placeholder="Nueva contraseña"></div></div>`;
// LOGOS
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">📌 LOGOS</label><div class="fr"><div class="fg"><label class="fl">Logo Encabezado</label><input type="file" accept="image/*" style="font-size:11px" onchange="imgUp(this,'sc-hl')"><input type="hidden" id="sc-hl"></div><div class="fg"><label class="fl">Logo Pie de Página</label><input type="file" accept="image/*" style="font-size:11px" onchange="imgUp(this,'sc-fl')"><input type="hidden" id="sc-fl"></div></div></div>`;
// NAV LINKS
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">🔗 MENÚ DE NAVEGACIÓN</label>`;
const navL=S.sc.navLinks||defSC.navLinks;
navL.forEach((n,i)=>{h+=`<div class="fr" style="margin-bottom:6px"><div class="fg"><label class="fl">Texto ${i+1}</label><input class="fi sc-navl" value="${esc(n.label)}" data-idx="${i}"></div><div class="fg"><label class="fl">Acción</label><select class="fi sc-nava" data-idx="${i}"><option value="productos"${n.action==='productos'?' selected':''}>Productos</option><option value="ofertas"${n.action==='ofertas'?' selected':''}>Ofertas</option><option value="contacto"${n.action==='contacto'?' selected':''}>Contacto</option></select></div></div>`;});
h+=`<button style="font-size:12px;color:var(--blue);background:0;border:0;margin-top:4px" onclick="addNavLink()">+ Agregar enlace</button></div>`;
// SECTIONS ORDER
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">📐 SECCIONES DEL HOME (arrastra para reordenar)</label><div id="sec-list" style="display:flex;flex-direction:column;gap:4px">`;
const allSecs={hero:'🖼️ Hero/Slider',ofertas:'🔥 Ofertas',destacados:'⭐ Destacados',categorias:'📂 Categorías',beneficios:'⭐ Beneficios'};
const available=Object.keys(allSecs);
available.forEach(s=>{const active=secs.includes(s);h+=`<label class="sec-item${active?' active':''}" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:${active?'#f0f7ff':'#f8f8fa'};border:1px solid ${active?'var(--blue)':'var(--brd)'};border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="sc-sec" value="${s}" ${active?'checked':''}> ${allSecs[s]}</label>`;});
h+=`</div></div>`;
// HIGHLIGHTS
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">⭐ DESTACADOS (banners de marca/producto)</label>`;
const hls=S.sc.highlights||[];
hls.forEach((hl,i)=>{h+=`<div style="background:#f8f8fa;border-radius:10px;padding:8px;margin-bottom:6px"><div class="fr"><div class="fg"><label class="fl">Título ${i+1}</label><input class="fi sc-hlt" value="${esc(hl.title)}" data-idx="${i}"></div><div class="fg"><label class="fl">Categoría (link)</label><select class="fi sc-hll" data-idx="${i}"><option value="">Sin enlace</option>${RAW.c.map(c=>`<option value="${c}"${hl.link===c?' selected':''}>${c}</option>`).join('')}</select></div></div><div class="fg"><label class="fl">Imagen URL o subir</label><input class="fi sc-hli" value="${esc(hl.img)}" data-idx="${i}"><input type="file" accept="image/*" style="font-size:10px;margin-top:2px" onchange="imgUp(this,this.previousElementSibling.id)" id=""></div></div>`;});
h+=`<button style="font-size:12px;color:var(--blue);background:0;border:0;margin-top:4px" onclick="addHighlight()">+ Agregar banner</button></div>`;
// HERO
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">🖼️ HERO / SLIDER</label><div class="fg"><label class="fl">Título</label><input class="fi" id="sc-ht" value="${esc(c.ht)}"></div><div class="fg"><label class="fl">Subtítulo</label><textarea class="fi" id="sc-hs" style="min-height:40px;resize:vertical">${c.hs}</textarea></div>`;
hi.forEach((im,i)=>{h+=`<div class="fg"><label class="fl">Slide ${i+1}</label><input class="fi" id="sc-hi${i}" value="${esc(im.img)}" placeholder="URL..."><input type="file" accept="image/*" style="font-size:10px;margin-top:2px" onchange="imgUp(this,'sc-hi${i}')"></div>`;});
h+=`</div>`;
// FEATURED CATS
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">🏷️ CATEGORÍAS DESTACADAS</label><div style="display:flex;flex-wrap:wrap;gap:4px">`;
RAW.c.forEach(ck=>{const chk=c.fc.includes(ck);h+=`<label style="font-size:11px;display:flex;align-items:center;gap:3px;padding:4px 8px;background:${chk?'#0071e315':'#f5f5f5'};border-radius:6px;cursor:pointer;border:1px solid ${chk?'#0071e3':'#e5e5e5'}" onclick="toggleFC(this)"><input type="checkbox" class="sc-fc" value="${ck}" ${chk?'checked':''} style="width:12px;height:12px;pointer-events:none">${IC[ck]||''} ${ck}</label>`;});
h+=`</div></div>`;
// CAT IMAGES
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">🖼️ IMÁGENES DE CATEGORÍAS</label>`;
RAW.c.forEach(ck=>{h+=`<div class="fg"><label class="fl">${IC[ck]||''} ${ck}</label><input class="fi sc-ci" data-cat="${ck}" value="${esc(getCatImg(ck))}" placeholder="URL imagen..."><input type="file" accept="image/*" style="font-size:10px;margin-top:2px" onchange="imgUp(this,this.previousElementSibling.id)" id=""></div>`;});
h+=`</div>`;
// BENEFITS
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">⭐ BENEFICIOS</label><div class="fg"><label class="fl">Título</label><input class="fi" id="sc-bt" value="${esc(c.bt)}"></div>`;
c.bs.forEach((b,i)=>{h+=`<div style="background:#f8f8fa;border-radius:10px;padding:8px;margin-bottom:6px"><div class="fr"><div class="fg"><label class="fl">Ícono</label><input class="fi" id="sc-bi${i}" value="${b.i}"></div><div class="fg"><label class="fl">Título</label><input class="fi" id="sc-bti${i}" value="${esc(b.t)}"></div></div><div class="fg"><label class="fl">Descripción</label><input class="fi" id="sc-bd${i}" value="${esc(b.d)}"></div></div>`;});
h+=`</div>`;
// FOOTER/CONTACT
h+=`<div class="sec-ed"><label class="fl" style="color:var(--blue)">📋 PIE DE PÁGINA / CONTACTO</label><div class="fg"><label class="fl">Texto footer</label><textarea class="fi" id="sc-ft" style="min-height:36px;resize:vertical">${c.ft}</textarea></div><div class="fg"><label class="fl">Dirección</label><textarea class="fi" id="sc-addr" style="min-height:36px;resize:vertical">${c.addr||''}</textarea></div><div class="fr"><div class="fg"><label class="fl">Teléfono</label><input class="fi" id="sc-phone" value="${c.phone||''}"></div><div class="fg"><label class="fl">Instagram URL</label><input class="fi" id="sc-ig" value="${c.ig||''}"></div></div><div class="fr"><div class="fg"><label class="fl">Instagram @</label><input class="fi" id="sc-igh" value="${c.igHandle||''}"></div><div class="fg"><label class="fl">TikTok @</label><input class="fi" id="sc-tth" value="${c.ttHandle||''}"></div></div><div class="fg"><label class="fl">TikTok URL</label><input class="fi" id="sc-tt" value="${c.tt||''}"></div><div class="fg"><label class="fl">Datos bancarios</label><textarea class="fi" id="sc-bank" style="min-height:60px;resize:vertical">${c.bank||''}</textarea></div></div>`;
h+=`<div class="br"><button class="bf2 bl" style="flex:1" onclick="saveSiteEd()">Guardar Todo</button><button class="bf2 gr" style="flex:1" onclick="closeModal()">Cancelar</button></div></div></div>`;
document.getElementById('modals').innerHTML=h;
}
function addHighlight(){
const idx=document.querySelectorAll('.sc-hlt').length;
const div=document.createElement('div');div.style.cssText='background:#f8f8fa;border-radius:10px;padding:8px;margin-bottom:6px';
div.innerHTML=`<div class="fr"><div class="fg"><label class="fl">Título ${idx+1}</label><input class="fi sc-hlt" value="" data-idx="${idx}"></div><div class="fg"><label class="fl">Categoría (link)</label><select class="fi sc-hll" data-idx="${idx}"><option value="">Sin enlace</option>${RAW.c.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div></div><div class="fg"><label class="fl">Imagen URL</label><input class="fi sc-hli" value="" data-idx="${idx}"></div>`;
event.target.parentElement.insertBefore(div,event.target);
}

function addNavLink(){
const cont=document.querySelector('.sec-ed');
// This just adds visually; actual save reads all inputs
const idx=document.querySelectorAll('.sc-navl').length;
const div=document.createElement('div');div.className='fr';div.style.marginBottom='6px';
div.innerHTML=`<div class="fg"><label class="fl">Texto ${idx+1}</label><input class="fi sc-navl" value="" data-idx="${idx}"></div><div class="fg"><label class="fl">Acción</label><select class="fi sc-nava" data-idx="${idx}"><option value="productos">Productos</option><option value="ofertas">Ofertas</option><option value="contacto">Contacto</option></select></div>`;
// Insert before the + button
const addBtn=event.target;
addBtn.parentElement.insertBefore(div,addBtn);
}

function toggleFC(lbl){const cb=lbl.querySelector('input');cb.checked=!cb.checked;lbl.style.background=cb.checked?'#0071e315':'#f5f5f5';lbl.style.borderColor=cb.checked?'#0071e3':'#e5e5e5';}

function saveSiteEd(){
const hi=getHI();S.sc.pw=document.getElementById('sc-pw').value||'aragua2024';
S.sc.ht=document.getElementById('sc-ht').value;S.sc.hs=document.getElementById('sc-hs').value;
S.sc.ft=document.getElementById('sc-ft').value;S.sc.bt=document.getElementById('sc-bt').value;
S.sc.fc=[...document.querySelectorAll('.sc-fc:checked')].map(x=>x.value);
S.sc.sections=[...document.querySelectorAll('.sc-sec:checked')].map(x=>x.value);
const hlTitles=document.querySelectorAll('.sc-hlt'),hlLinks=document.querySelectorAll('.sc-hll'),hlImgs=document.querySelectorAll('.sc-hli');
S.sc.highlights=[];hlTitles.forEach((el,i)=>{const t=el.value.trim(),img=hlImgs[i]?.value||'',link=hlLinks[i]?.value||'';if(t||img)S.sc.highlights.push({title:t,img:img,link:link});});
const navLabels=document.querySelectorAll('.sc-navl'),navActions=document.querySelectorAll('.sc-nava');
S.sc.navLinks=[];navLabels.forEach((el,i)=>{const lbl=el.value.trim(),act=navActions[i]?.value||'productos';if(lbl)S.sc.navLinks.push({label:lbl,action:act});});
S.sc.hi=hi.map((_,i)=>({img:document.getElementById('sc-hi'+i).value}));
S.sc.bs=S.sc.bs.map((_,i)=>({i:document.getElementById('sc-bi'+i).value,t:document.getElementById('sc-bti'+i).value,d:document.getElementById('sc-bd'+i).value}));
S.sc.addr=document.getElementById('sc-addr').value;S.sc.phone=document.getElementById('sc-phone').value;
S.sc.ig=document.getElementById('sc-ig').value;S.sc.igHandle=document.getElementById('sc-igh').value;
S.sc.tt=document.getElementById('sc-tt').value;S.sc.ttHandle=document.getElementById('sc-tth').value;
S.sc.bank=document.getElementById('sc-bank').value;
const hl=document.getElementById('sc-hl').value;if(hl&&hl.startsWith('data:'))S.sc.headerLogo=hl;
const fl=document.getElementById('sc-fl').value;if(fl&&fl.startsWith('data:'))S.sc.footerLogo=fl;
// Cat images
const ci={};document.querySelectorAll('.sc-ci').forEach(el=>{const cat=el.dataset.cat;if(el.value)ci[cat]=el.value;});S.sc.catImgs=ci;
saveSC();closeModal();toast('✓ Sitio actualizado');render();
}

// ===== MAIN RENDER =====
function render(){
const app=document.getElementById('app'),cc=S.ca.reduce((s,c)=>s+c.qt,0),secs=getSecs();
// Header
let h=`<header class="hd"><div class="hd-in"><div style="display:flex;align-items:center;gap:20px"><img src="${getHL()}" alt="Aragua Color" class="hd-logo" onclick="S.v='home';S.q='';S.ct=null;render();"><nav class="hd-nav">${(S.sc.navLinks||defSC.navLinks).map(n=>`<span class="${S.v===n.action?'on':''}" onclick="${n.action==='productos'?'goP()':`S.v='${n.action}';S.ct=null;render()`}">${n.label}</span>`).join('')}</nav></div><div class="hd-r"><button class="ib" onclick="showCart()">🛒${cc>0?`<span class="cb">${cc}</span>`:''}</button>${S.ad?`<button class="ib" style="opacity:1" onclick="showSiteEd()">📝</button>`:''}<button class="ib" style="opacity:${S.ad?1:.4}" onclick="${S.ad?`S.ad=false;toast('Admin off');render()`:'showAdminLogin()'}">${S.ad?'🔓':'⚙️'}</button><button class="mob-btn" onclick="S.mb=!S.mb;render()">☰</button></div></div>${S.mb?`<div class="mm">${(S.sc.navLinks||defSC.navLinks).map(n=>`<span onclick="${n.action==='productos'?'goP()':n.action==='ofertas'?"S.v='ofertas';S.ct=null":`S.v='${n.action}'`};S.mb=false;render()">${n.label}</span>`).join('')}</div>`:''}</header>`;

if(S.v==='home'){
const hi=getHI();
const secHTML={
hero:`<section class="hero"><div class="hero-bg" style="background-image:url(${hi[S.hi].img})"></div><div class="hero-ov"></div><div class="hero-c"><h1 class="hero-t">${S.sc.ht}</h1><p class="hero-s">${S.sc.hs}</p><div class="sr sr-b"><span class="sr-i">🔍</span><input class="sr-inp" placeholder="Buscar productos..." oninput="onSearch(this.value)"></div><div class="hero-tags">${S.sc.fc.map(c=>`<button class="htag" onclick="goP('${c}')">${IC[c]||''} ${c}</button>`).join('')}</div><div class="dots">${hi.map((_,i)=>`<button class="dot${i===S.hi?' on':''}" onclick="S.hi=${i};render()"></button>`).join('')}</div></div></section>`,

ofertas:(()=>{const of2=S.ps.filter(p=>p.sl);return(of2.length>0||S.ad)?`<section class="ofsec"><div class="si"><div class="sh"><h2 class="st" style="color:var(--red)">🔥 Ofertas</h2>${of2.length?`<button class="sl" onclick="S.v='ofertas';render()">Ver todas →</button>`:''}</div>${of2.length?`<div class="osc">${of2.slice(0,10).map(p=>`<div class="pc" style="flex:0 0 180px;scroll-snap-align:start" onclick="showDetail(findP(${p.id}))"><div class="pc-bdg">OFERTA</div><div class="pc-im" style="height:120px;background:${CL[p.ct]||'#eee'}12">${p.im?`<img src="${p.im}">`:`<span class="pc-ph">${IC[p.ct]||'🔧'}</span>`}</div><div class="pc-b"><div class="pc-nm">${p.nm}</div><div class="pc-pr"><span class="pc-p sa">${fmt(p.sp)}</span><span class="pc-ol">${fmt(p.pr)}</span></div></div></div>`).join('')}</div>`:`<div style="text-align:center;padding:20px;color:var(--gray);background:#fff5f5;border-radius:14px;font-size:13px">${S.ad?'Edita un producto → "En oferta"':'Sin ofertas'}</div>`}</div></section>`:''})(),

categorias:`<section class="si" style="padding-top:40px;padding-bottom:40px"><h2 class="st">Explora por Categoría</h2><div class="cg">${RAW.c.map(c=>{const n=S.ps.filter(p=>p.ct===c).length,co=CL[c]||'#333';return`<button class="cc" onclick="goP('${c}')"><div class="cc-i" style="background-image:url(${getCatImg(c)})"><div class="cc-o" style="background:linear-gradient(135deg,${co}dd,${co}88)"></div><span class="cc-ic">${IC[c]||'🔧'}</span></div><div class="cc-inf"><div class="cc-n">${c}</div><div class="cc-ct">${n} prod.</div></div></button>`;}).join('')}</div></section>`,



destacados:(()=>{const hls=S.sc.highlights||[];if(!hls.length)return '';const sizes=['hl-lg','hl-sm','hl-sm','hl-md','hl-sm','hl-lg'];return `<section class="si" style="padding-top:32px;padding-bottom:32px"><div class="hl-mosaic">${hls.map((hl,i)=>`<div class="hl-tile ${sizes[i%sizes.length]}" onclick="${hl.link?`goP('${hl.link}')`:''}" style="cursor:${hl.link?'pointer':'default'};background-image:url(${hl.img})"><div class="hl-ov"></div>${hl.title?`<div class="hl-cap">${hl.title}</div>`:''}</div>`).join('')}</div></section>`;})(),

beneficios:`<section class="bsec"><div class="si"><h2 class="st" style="text-align:center;margin-bottom:24px">${S.sc.bt}</h2><div class="bg">${S.sc.bs.map(b=>`<div class="bc"><div class="bc-i">${b.i}</div><h3 class="bc-t">${b.t}</h3><p class="bc-d">${b.d}</p></div>`).join('')}</div></div></section>`
};
secs.forEach(s=>{if(secHTML[s])h+=secHTML[s];});

}else if(S.v==='productos'||S.v==='ofertas'){
h+=`<div class="pp"><aside class="ps"><div class="ps-t">Categorías</div><button class="${!S.ct?'on':''}" onclick="S.ct=null;renderGrid()">Todos (${S.ps.length})</button>${RAW.c.map(c=>{const n=S.ps.filter(p=>p.ct===c).length;return`<button class="${S.ct===c?'on':''}" onclick="S.ct=${S.ct===c?'null':`'${c}'`};renderGrid()">${IC[c]||''} ${c} (${n})</button>`;}).join('')}</aside><div class="pm"><div class="pt"><div style="flex:1;min-width:200px"><div class="sr"><span class="sr-i">🔍</span><input class="sr-inp" placeholder="Buscar..." oninput="onSearch(this.value)" value="${S.q}"></div></div><div class="pt-r">${S.ad?`<button class="bn" onclick="showAddProd()">+ Nuevo</button><button class="btab on" onclick="showBulk()">📦 Masivo</button>`:''}<button class="bf" onclick="S.fo=!S.fo;render()">Filtros</button><select class="ss" onchange="S.so=this.value;renderGrid()"><option value="name"${S.so==='name'?' selected':''}>A-Z</option><option value="pa"${S.so==='pa'?' selected':''}>Menor $</option><option value="pd"${S.so==='pd'?' selected':''}>Mayor $</option><option value="stock"${S.so==='stock'?' selected':''}>Stock</option></select></div></div>${S.fo?`<div class="fb"><label style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" ${S.sf?'checked':''} onchange="S.sf=this.checked;renderGrid()"> Disponibles</label><label style="display:flex;align-items:center;gap:5px">Max $${S.mp}: <input type="range" min="0" max="600" value="${S.mp}" oninput="S.mp=+this.value;renderGrid()" style="width:80px"></label><select class="mcs" onchange="S.ct=this.value||null;renderGrid()"><option value="">Todas</option>${RAW.c.map(c=>`<option value="${c}"${S.ct===c?' selected':''}>${c}</option>`).join('')}</select></div>`:''}${S.ct?`<div style="margin-bottom:10px;display:flex;align-items:center;gap:6px"><span class="cp" style="background:${CL[S.ct]||'var(--blue)'}">${S.ct}</span><button style="background:0;border:0;cursor:pointer;color:var(--gray);font-size:13px" onclick="S.ct=null;renderGrid()">✕</button></div>`:''}<div class="rc" id="pcount">${getF().length} productos</div><div class="pg" id="pgrid"></div></div></div>`;

}else if(S.v==='contacto'){
h+=`<div class="cop"><h1>Contáctanos</h1><p class="co-s">¡Escribinos!</p><div class="co-g"><a href="https://wa.me/${WA}" target="_blank" class="coc wac"><span class="sic wai">${WI}</span><div><div class="co-n">WhatsApp</div><div class="co-d">${S.sc.phone}</div></div></a><a href="${S.sc.ig}" target="_blank" class="coc igc"><span class="sic igi">${IGI}</span><div><div class="co-n">Instagram</div><div class="co-d">${S.sc.igHandle}</div></div></a><a href="${S.sc.tt}" target="_blank" class="coc ttc"><span class="sic tti">${TTI}</span><div><div class="co-n">TikTok</div><div class="co-d">${S.sc.ttHandle}</div></div></a></div><div class="lb"><h3>📍 Ubicación</h3><p>${(S.sc.addr||'').replace(/\n/g,'<br>')}</p></div><div class="lb" style="margin-top:12px"><h3>🏦 Datos Bancarios</h3><p style="white-space:pre-line">${S.sc.bank||''}</p></div></div>`;
}

// Footer
h+=`<footer class="ft"><div class="ft-in"><div class="ft-c"><img src="${getFL()}" alt="" class="ft-l"><p>${S.sc.ft}</p></div><div class="ft-c"><h4>Ubicación</h4><p>📍 ${(S.sc.addr||'').replace(/\n/g,'<br>')}</p></div><div class="ft-c"><h4>Síguenos</h4><div class="ft-so"><a href="https://wa.me/${WA}" target="_blank"><span class="ft-si">${WI}</span> ${S.sc.phone}</a><a href="${S.sc.ig}" target="_blank"><span class="ft-si">${IGI}</span> ${S.sc.igHandle}</a><a href="${S.sc.tt}" target="_blank"><span class="ft-si">${TTI}</span> ${S.sc.ttHandle}</a></div></div></div><div class="ft-b">© 2026 Aragua Color · araguacolor.com</div></footer>`;

app.innerHTML=h;
if(S.v==='productos'||S.v==='ofertas'){const g=document.getElementById('pgrid');if(g){getF().forEach(p=>g.appendChild(mkCard(p)));if(!getF().length)g.innerHTML='<div class="es" style="grid-column:1/-1"><div style="font-size:48px">🔍</div><p>Sin resultados</p></div>';}}
}
